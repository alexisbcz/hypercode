name: Hypercode
options:
  bundleIdPrefix: dev.alexis
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    # Sparkle compares build numbers, so they follow the version: a 1.2.3 build updates to 1.2.4.
    CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)
packages:
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: 0.9.0
  HighlightSwift:
    url: https://github.com/appstefan/HighlightSwift
    from: 1.1.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
  MLXAudio:
    url: https://github.com/Blaizzy/mlx-audio-swift
    branch: main
targets:
  Hypercode:
    type: application
    platform: macOS
    sources:
      - path: Hypercode
        excludes:
          - Resources/bin
          - Info.plist
      # A folder reference, so the command line tool lands at Contents/Resources/bin/hypercode.
      - path: Hypercode/Resources/bin
        type: folder
        buildPhase: resources
    dependencies:
      - package: Markdown
      - package: HighlightSwift
      - package: MLXAudio
        product: MLXAudioTTS
      - package: MLXAudio
        product: MLXAudioCore
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.alexis.Hypercode
        GENERATE_INFOPLIST_FILE: YES
        # Sparkle's keys, which the generated Info.plist has no settings for.
        INFOPLIST_FILE: Hypercode/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Hypercode
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hypercode listens while you dictate a prompt.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Hypercode turns your dictation into text for the composer.
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_IDENTITY: "-"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
